[workspace]
# The core crate is a path dependency of the GUI. Without an explicit
# workspace it is *not* a member, so `cargo test -p tg-ws-proxy-core` and
# `cargo clippy -p tg-ws-proxy-core --tests` cannot resolve its dev-deps
# (rcgen, criterion) and the CI gates silently never ran the core tests.
members = ["core"]
resolver = "3"

[package]
name = "tg-ws-proxy-gui"
version = "1.2.1"
description = "Telegram Desktop WebSocket Proxy GUI"
authors = ["nsvl"]
license = "MIT"
repository = "https://github.com/rxzsu/tg-ws-rust"
edition = "2024"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tg_ws_proxy_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-clipboard-manager = "2.5.0"
# Cross-platform "open URL / file": replaces the hand-rolled ShellExecuteW /
# xdg-open code and is the only variant that also works on Android & iOS.
tauri-plugin-opener = "2"
tg-ws-proxy-core = { path = "./core" }
tokio = { version = "1.54", features = ["full"] }
# Explicit crypto provider selection at startup (see src/main.rs).
# `ring` matches the feature set used by quinn/tokio-rustls in the core crate.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(target_os = "android")'.dependencies]
# Used to toggle the foreground service from Rust (see `set_foreground_service`).
jni = "0.22"

# Release tuning (this manifest is the workspace root on CI, where the
# parent workspace below does not exist). LTO + single codegen unit for
# speed, strip for binary size.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

