# Keep the SHA-pinned actions current: Dependabot opens a PR per update with
# the new commit SHA, so a pin never rots and a compromised upstream tag
# cannot be pulled in silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
