name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # Single source of truth for release notes: CHANGELOG.md. The hardcoded
  # release body used to drift from the file within one release.
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract the version's section from CHANGELOG.md
        id: extract
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="CHANGELOG.md"
          if [ ! -f "$FILE" ]; then
            echo "::error file=$FILE::CHANGELOG.md is missing"
            exit 1
          fi
          # Built with index(), not a regex: the version contains `[`, `.` and
          # `]`, which are all metacharacters.
          BODY="$(awk -v want="[$VERSION]" '
            index($0, "## " want) == 1 { capture = 1; next }
            capture && /^## / { capture = 0 }
            capture { print }
          ' "$FILE" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "::error file=$FILE::no section [$VERSION] in CHANGELOG.md; add it before tagging"
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-26.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-26.04'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android is not covered by tauri-action, so it gets its own job and the
  # artifacts are attached to the same release. It waits for `release` so the
  # GitHub release already exists at upload time.
  android:
    needs: [notes, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # ubuntu-latest ships the Android SDK + NDK; Tauri only needs the paths.
      - name: Point Tauri at the preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: bun install && bun run build

      - name: Init Android project (idempotent)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bunx tauri android init --ci
          fi

      # Optional release signing: add the four repository secrets to produce a
      # signed APK. Without them the build still succeeds but the artifact is
      # unsigned and cannot be installed as an update over a signed build.
      - name: Decode release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: building an unsigned APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (arm64 + universal)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bunx tauri android build --apk --target aarch64 --ci

      - name: Upload APK to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch without a tag: skipping release upload"
            exit 0
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME does not exist (tauri-action may have failed)"
            exit 1
          fi
          # `gh release upload` needs a plain file list, and the APK path
          # depends on how Gradle named the variant.
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
