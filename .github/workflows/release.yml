name: Release

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-26.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-26.04'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ### 🚀 Telegram WebSocket Proxy GUI v__VERSION__

            #### Что нового в v0.4.0:
            - **QR-код ссылки**: кнопка в карточке подключения — наведите камеру телефона, Telegram предложит добавить прокси.
            - **Сплиттер без аллокаций**: пакеты больше не копируются по одному `Vec` на пакет (~16% быстрее по бенчу).
            - **Чистка кода**: удалён мёртвый код (пул, неиспользуемые команды), ядро и GUI без clippy-предупреждений.
            - **CI-gate**: clippy, тесты и сборка фронтенда на каждый push.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
