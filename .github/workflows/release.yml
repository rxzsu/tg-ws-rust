name: Release

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-26.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ### 🚀 Telegram WebSocket Proxy GUI v__VERSION__

            #### Что нового в v0.3.0 (performance):
            - **Release-профиль (LTO + strip)**: бинарь ядра меньше и быстрее (~4.5 → ~3.9 МБ на ядре).
            - **Буферы из конфига**: размер I/O-буферов моста и `SO_RCVBUF`/`SO_SNDBUF` всех сокетов берутся из настройки `buffer_size`, а не захардкожены.
            - **Пул без глобального лока**: замки по доменам, прогрев всех DC1–DC5, лимитированное фоновое пополнение, настраиваемый TTL (`pool_max_age_secs`).
            - **TLS session resumption**: общий `ClientConfig` для всех апстрим-коннектов — повторные хендшейки к тем же DC короче.
            - **Бенчмарки**: `cargo bench -p tg-ws-proxy-core` (ре-шифровка, сплиттер, создание криптоконтекста).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
