name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for every job in this workflow: none of them needs
# more than reading the repo. Jobs that push artifacts/releases declare their
# own elevated scope (see release.yml).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.9.3
        with:
          workspaces: src-tauri

      # GUI crate links WebKit on Linux (glib-sys build script needs it).
      - name: Install dependencies (Ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      # `core` is a workspace member, so its dev-dependencies resolve.
      # Benches stay out of the gate (long-running); verify locally with
      # `cargo bench -p tg-ws-proxy-core`.
      - name: Clippy (core, deny warnings)
        run: cargo clippy -p tg-ws-proxy-core --lib --tests --locked -- -D warnings
        working-directory: src-tauri

      - name: Clippy (gui, deny warnings)
        run: cargo clippy -p tg-ws-proxy-gui --lib --locked -- -D warnings
        working-directory: src-tauri

      - name: Tests (core)
        run: cargo test -p tg-ws-proxy-core --locked
        working-directory: src-tauri

      # The frontend gate: formatter, native typechecker (TS layer — the
      # Rust<->TS config/telemetry contract lives there), then the build.
      - name: Frontend fmt + typecheck + build
        run: bun install --frozen-lockfile && bun run fmt:check && bun run build

  # Compile-only gate for the mobile target: catches desktop-only APIs used
  # without `cfg(desktop)`, which is exactly how the first Android build broke.
  android-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Rust with the Android target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.9.3
        with:
          workspaces: src-tauri
          key: android-check

      - name: Configure NDK toolchain
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # `tauri::generate_context!` needs the built frontend on disk.
      - name: Frontend build
        run: bun install --frozen-lockfile && bun run build

      - name: Cargo check (Android)
        run: cargo check -p tg-ws-proxy-gui --locked --target aarch64-linux-android
        working-directory: src-tauri

  # Previously a separate "Android APK" workflow on every main push. It lives
  # here now so a push produces one CI run (check + Android compile + APK/AAB)
  # instead of two unrelated workflow runs. Release builds stay in release.yml:
  # tags need release permissions and publish artifacts, which is a different
  # lifecycle.
  android-apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.8.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.9.3
        with:
          workspaces: src-tauri
          key: android

      # ubuntu-latest ships the Android SDK + NDK; Tauri only needs the paths.
      - name: Point Tauri at the preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bunx tauri android init --ci
          fi

      - name: Decode release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: building an unsigned APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (arm64)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bunx tauri android build --apk --target aarch64 --ci

      - name: Build release AAB (Play Store)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bunx tauri android build --aab --target aarch64 --ci

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.8.0
        with:
          name: tg-ws-proxy-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
