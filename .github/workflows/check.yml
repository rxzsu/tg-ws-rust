name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # GUI crate links WebKit on Linux (glib-sys build script needs it).
      - name: Install dependencies (Ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      # `core` is a workspace member, so its dev-dependencies resolve.
      # Benches stay out of the gate (long-running); verify locally with
      # `cargo bench -p tg-ws-proxy-core`.
      - name: Clippy (core, deny warnings)
        run: cargo clippy -p tg-ws-proxy-core --lib --tests --locked -- -D warnings
        working-directory: src-tauri

      - name: Clippy (gui, deny warnings)
        run: cargo clippy -p tg-ws-proxy-gui --lib --locked -- -D warnings
        working-directory: src-tauri

      - name: Tests (core)
        run: cargo test -p tg-ws-proxy-core --locked
        working-directory: src-tauri

      - name: Frontend build
        run: bun install && bun run build

  # Compile-only gate for the mobile target: catches desktop-only APIs used
  # without `cfg(desktop)`, which is exactly how the first Android build broke.
  android-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-check

      - name: Configure NDK toolchain
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # `tauri::generate_context!` needs the built frontend on disk.
      - name: Frontend build
        run: bun install && bun run build

      - name: Cargo check (Android)
        run: cargo check -p tg-ws-proxy-gui --locked --target aarch64-linux-android
        working-directory: src-tauri

  # Previously a separate "Android APK" workflow on every main push. It lives
  # here now so a push produces one CI run (check + Android compile + APK/AAB)
  # instead of two unrelated workflow runs. Release builds stay in release.yml:
  # tags need release permissions and publish artifacts, which is a different
  # lifecycle.
  android-apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # ubuntu-latest ships the Android SDK + NDK; Tauri only needs the paths.
      - name: Point Tauri at the preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build frontend
        run: bun install && bun run build

      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bunx tauri android init --ci
          fi

      - name: Decode release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: building an unsigned APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (arm64)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bunx tauri android build --apk --target aarch64 --ci

      - name: Build release AAB (Play Store)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bunx tauri android build --aab --target aarch64 --ci

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
